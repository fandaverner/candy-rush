<script>
// Sdílená matematika automatů: výplaty „ways“ s wildy a násobky
const SlotMath = (() => {
  function pickW(arr, w, rnd) { let t = 0; for (const x of w) t += x; let x = rnd() * t; for (let i = 0; i < arr.length; i++) if ((x -= w[i]) < 0) return arr[i]; return arr[arr.length - 1]; }
  // g[reel][row] = {s, m?}; syms = [{id, pay:[3,4,5]}]; wild = id wildu
  // Násobky wildů v jedné cestě se NÁSOBÍ (součet přes cesty = součin součtů po válcích)
  function ways(g, syms, wild, scale = 1) {
    const out = [];
    for (const s of syms) {
      let factor = 1, count = 1, len = 0, real = false; const cells = [];
      for (let r = 0; r < g.length; r++) {
        let f = 0, c = 0;
        for (let y = 0; y < g[r].length; y++) {
          const x = g[r][y];
          if (x.s === s.id) { f += 1; c++; real = true; cells.push([r, y]); }
          else if (x.s === wild) { f += x.m || 1; c++; cells.push([r, y]); }
        }
        if (!f) break;
        factor *= f; count *= c; len++;
      }
      if (len >= 3 && real) {
        const win = s.pay[Math.min(len, 5) - 3] * factor * scale;
        out.push({ s: s.id, len, ways: count, mult: Math.round(factor / count * 100) / 100, win, cells: cells.filter(([r]) => r < len) });
      }
    }
    return { wins: out, total: out.reduce((a, w) => a + w.win, 0) };
  }
  const count = (g, s) => { let n = 0; for (const col of g) for (const x of col) if (x.s === s) n++; return n; };
  return { pickW, ways, count };
})();
if (typeof module !== 'undefined') module.exports = SlotMath;

// Poklad faraona – 5×3, 243 cest, Hold & Win s mincemi a 4 jackpoty
const Game = (() => {
  const SM = typeof SlotMath !== 'undefined' ? SlotMath : require('./slotmath.js');
  const REELS = 5, ROWS = 3;
  const SYMS = [
    { id: 0, name: 'J', w: 14, pay: [0.10, 0.25, 0.50] },
    { id: 1, name: 'Q', w: 13, pay: [0.10, 0.25, 0.60] },
    { id: 2, name: 'K', w: 12, pay: [0.15, 0.30, 0.75] },
    { id: 3, name: 'A', w: 11, pay: [0.20, 0.40, 1.00] },
    { id: 4, name: 'Ankh', w: 8, pay: [0.30, 0.75, 1.50] },
    { id: 5, name: 'Horovo oko', w: 7, pay: [0.40, 1.00, 2.00] },
    { id: 6, name: 'Skarab', w: 6, pay: [0.50, 1.25, 2.50] },
    { id: 7, name: 'Kočka Bastet', w: 5, pay: [0.75, 2.00, 4.00] },
  ];
  const WILD = 8, COIN = 9;
  const COIN_V = [1, 2, 3, 4, 5, 8, 10, 15, 20, 25, 50, 'MINI', 'MINOR', 'MAJOR'];
  const COIN_W = [22, 20, 15, 12, 10, 7, 5, 3.5, 2.2, 1.5, 0.6, 1.2, 0.35, 0.08];
  const JPV = { MINI: 20, MINOR: 50, MAJOR: 200, GRAND: 1000 };
  const CFG = { wildP: 0.05, coinP: 0.122, respinP: 0.062, payScale: 2.15, buyX: 55 };
  const TRIG = 6;

  function coin(rnd) { return { s: COIN, v: SM.pickW(COIN_V, COIN_W, rnd) }; }
  function cell(r, rnd) {
    const x = rnd();
    if (x < CFG.coinP) return coin(rnd);
    if (r >= 1 && r <= 3 && x < CFG.coinP + CFG.wildP) return { s: WILD };
    return { s: SM.pickW(SYMS.map(s => s.id), SYMS.map(s => s.w), rnd) };
  }
  const filler = rnd => cell(Math.floor(rnd() * 5), rnd);
  function grid(rnd) { return Array.from({ length: REELS }, (_, r) => Array.from({ length: ROWS }, () => cell(r, rnd))); }
  const coinValue = v => typeof v === 'number' ? v : JPV[v];

  // základní spin
  function base(rnd) {
    const g = grid(rnd), ev = SM.ways(g, SYMS, WILD, CFG.payScale);
    const coins = SM.count(g, COIN);
    return { g, wins: ev.wins, total: ev.total, trigger: coins >= TRIG };
  }
  // Hold & Win: vrací seznam kroků (pro animaci) a celkovou výhru
  function holdAndWin(startGrid, rnd) {
    const locked = startGrid.map(col => col.map(x => x.s === COIN ? x : null));
    const steps = []; let respins = 3;
    const filled = () => locked.flat().filter(Boolean).length;
    while (respins > 0 && filled() < REELS * ROWS) {
      const news = [];
      for (let r = 0; r < REELS; r++) for (let y = 0; y < ROWS; y++)
        if (!locked[r][y] && rnd() < CFG.respinP) { locked[r][y] = coin(rnd); news.push([r, y, locked[r][y]]); }
      respins = news.length ? 3 : respins - 1;
      steps.push({ news, respins });
    }
    let total = 0; for (const col of locked) for (const x of col) if (x) total += coinValue(x.v);
    const grand = filled() === REELS * ROWS;
    if (grand) total += JPV.GRAND;
    return { steps, locked, total, grand };
  }
  function buyGrid(rnd) { // koupený bonus: 6 mincí na náhodných místech
    const g = grid(rnd).map(col => col.map(x => x.s === COIN ? { s: 0 } : x));
    const pos = []; for (let r = 0; r < REELS; r++) for (let y = 0; y < ROWS; y++) pos.push([r, y]);
    for (let i = pos.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pos[i], pos[j]] = [pos[j], pos[i]]; }
    pos.slice(0, TRIG).forEach(([r, y]) => g[r][y] = coin(rnd));
    return g;
  }
  return { REELS, ROWS, SYMS, WILD, COIN, JPV, CFG, TRIG, filler, base, holdAndWin, buyGrid, coinValue };
})();
if (typeof module !== 'undefined') module.exports = Game;

.buy{border:0;border-radius:12px;padding:9px;font-family:var(--tfont);font-weight:800;font-size:14px;cursor:pointer;color:#fff;letter-spacing:1px;background:var(--buybg);box-shadow:0 3px 0 #0008,0 0 14px var(--glow);text-shadow:0 1px 2px #000}
.buy:disabled{filter:grayscale(.7);opacity:.6}.buy small{font-family:'Fredoka';font-weight:600;opacity:.85}
.foot{text-align:center;font-size:10px;opacity:.6}
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:#000c;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.card{max-width:420px;width:100%;max-height:88vh;overflow:auto;border-radius:20px;padding:20px 18px;text-align:center;color:#fff;background:var(--cardbg);border:1px solid var(--acc2);box-shadow:0 0 40px var(--glow);animation:kcin .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes kcin{from{transform:scale(.6);opacity:0}}
.card h2{margin:0 0 6px;font-family:var(--tfont);font-size:26px;color:var(--acc);text-shadow:0 0 12px var(--glow)}
.card .big{font-family:var(--tfont);font-weight:900;font-size:44px;color:#fff6d0;text-shadow:0 0 16px var(--glow);margin:4px 0}
.card p{margin:6px 0;font-size:14px;line-height:1.45}
.card .go{margin-top:10px;border:0;border-radius:999px;padding:11px 26px;font-family:var(--tfont);font-weight:800;font-size:16px;cursor:pointer;color:var(--btntext);background:var(--btn);box-shadow:0 3px 0 #0008}
.card .ghost{background:#ffffff22;color:#fff;margin-left:6px}
.pt{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}.pt td,.pt th{padding:3px;border-bottom:1px solid #ffffff1a}.pt th{font-size:10px;color:var(--acc)}
.pt svg{width:34px;height:30px;vertical-align:middle}
.rules{text-align:left;font-size:13px;line-height:1.45;padding-left:18px}.rules li{margin:3px 0}
.confetti{position:fixed;top:-20px;z-index:60;pointer-events:none;font-size:20px;animation:kfall linear forwards}
@keyframes kfall{to{transform:translateY(110vh) rotate(540deg)}}
.fly{position:fixed;z-index:30;pointer-events:none;font-weight:700;font-size:16px;color:#fff;text-shadow:0 0 4px #000,0 0 10px var(--glow);transition:transform .6s cubic-bezier(.5,0,.3,1),opacity .6s}

    for (const [r, y, c] of step.news) { grid[r][y] = c; Kit.setCell(r, y, c, ' landed'); sum += val(c); Kit.sfx.ding(); await Kit.wait(220); }
    Kit.fsBar(true, step.respins, sum, 'RESPINY', 'SOUČET MINCÍ');
    await Kit.wait(step.news.length ? 500 : 350);
  }
  // výplata
  let total = 0;
  for (let r = 0; r < Game.REELS; r++) for (let y = 0; y < Game.ROWS; y++) {
    const c = grid[r][y]; if (c.s !== Game.COIN) continue;
    const v = val(c); total += v; Kit.cell(r, y).classList.add('win'); Kit.setWin(total); Kit.sfx.ding(y + r);
    if (typeof c.v === 'string') { const i = JPN.indexOf(c.v); document.getElementById('jp' + i).classList.add('hit'); Kit.sfx.jp(); await Kit.wait(900); }
    await Kit.wait(160);
  }
  if (h.grand) { total += Game.JPV.GRAND * b; document.getElementById('jp3').classList.add('hit'); Kit.sfx.jp(); Kit.confetti(80, ['🪙', '👑', '✨', '💎']); await Kit.modal(`<h2>GRAND JACKPOT</h2><div class="big">${Kit.fmt(Game.JPV.GRAND * b)}</div><p>Zaplnil jsi všech 15 polí!</p>`, 'SUPER', Kit.auto ? 3000 : 0); }
  Kit.setWin(total);
  document.querySelectorAll('.jp.hit').forEach(e => setTimeout(() => e.classList.remove('hit'), 2500));
  Kit.confetti(total >= b * 30 ? 50 : 18, ['🪙', '✨', '💰']);
  await Kit.modal(`<h2>Poklad nalezen</h2><div class="big">${Kit.fmt(total)}</div><p>${(Math.round(total / b * 10) / 10).toLocaleString('cs-CZ')}× sázka</p>`, 'POKRAČOVAT', Kit.auto ? 2800 : 0);
  Kit.bonus = false; Kit.fsBar(false, 0, 0);
  Kit.render(grid.map(col => col.map(c => c.s === -1 ? Game.filler(Math.random) : c)));
  return total;
}
</script>
