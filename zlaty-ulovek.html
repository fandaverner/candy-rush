<script>
// Sdílená matematika automatů: výplaty „ways“ s wildy a násobky
const SlotMath = (() => {
  function pickW(arr, w, rnd) { let t = 0; for (const x of w) t += x; let x = rnd() * t; for (let i = 0; i < arr.length; i++) if ((x -= w[i]) < 0) return arr[i]; return arr[arr.length - 1]; }
  // g[reel][row] = {s, m?}; syms = [{id, pay:[3,4,5]}]; wild = id wildu
  // Násobky wildů v jedné cestě se NÁSOBÍ (součet přes cesty = součin součtů po válcích)
  function ways(g, syms, wild, scale = 1) {
    const out = [];
    for (const s of syms) {
      let factor = 1, count = 1, len = 0, real = false; const cells = [];
      for (let r = 0; r < g.length; r++) {
        let f = 0, c = 0;
        for (let y = 0; y < g[r].length; y++) {
          const x = g[r][y];
          if (x.s === s.id) { f += 1; c++; real = true; cells.push([r, y]); }
          else if (x.s === wild) { f += x.m || 1; c++; cells.push([r, y]); }
        }
        if (!f) break;
        factor *= f; count *= c; len++;
      }
      if (len >= 3 && real) {
        const win = s.pay[Math.min(len, 5) - 3] * factor * scale;
        out.push({ s: s.id, len, ways: count, mult: Math.round(factor / count * 100) / 100, win, cells: cells.filter(([r]) => r < len) });
      }
    }
    return { wins: out, total: out.reduce((a, w) => a + w.win, 0) };
  }
  const count = (g, s) => { let n = 0; for (const col of g) for (const x of col) if (x.s === s) n++; return n; };
  return { pickW, ways, count };
})();
if (typeof module !== 'undefined') module.exports = SlotMath;

// Zlatý úlovek – 5×3, 243 cest; ve free spinech rybář (wild) sbírá hodnoty ryb, každý 4. rybář = +10 spinů a vyšší násobek
const Game = (() => {
  const SM = typeof SlotMath !== 'undefined' ? SlotMath : require('./slotmath.js');
  const REELS = 5, ROWS = 3;
  const SYMS = [
    { id: 0, name: 'J', w: 14, pay: [0.10, 0.25, 0.50] },
    { id: 1, name: 'Q', w: 13, pay: [0.10, 0.25, 0.60] },
    { id: 2, name: 'K', w: 12, pay: [0.15, 0.30, 0.75] },
    { id: 3, name: 'A', w: 11, pay: [0.20, 0.40, 1.00] },
    { id: 4, name: 'Splávek', w: 8, pay: [0.30, 0.75, 1.50] },
    { id: 5, name: 'Vážka', w: 7, pay: [0.40, 1.00, 2.00] },
    { id: 6, name: 'Rybářský prut', w: 6, pay: [0.50, 1.25, 2.50] },
    { id: 7, name: 'Krabička s návnadou', w: 5, pay: [0.75, 2.00, 4.00] },
    { id: 9, name: 'Ryba', w: 7, pay: [0.30, 0.75, 1.50] },
  ];
  const WILD = 8, FISH = 9, SCATTER = 10;
  const FISH_V = [2, 3, 5, 10, 15, 20, 25, 50, 100, 250, 1000];
  const FISH_W = [34, 28, 20, 10, 4, 2, 1.2, 0.4, 0.08, 0.01, 0.001];
  const FREE_SPINS = { 3: 10, 4: 15, 5: 20 };
  const LEVELS = [1, 2, 3, 4]; // násobek sběru po každých 4 rybářích
  const CFG = { scatterP: 0.0235, fishPFS: 0.046, wildPFS: 0.032, payScale: 4.05, fsPayScale: 0.7, collectScale: 1, buyX: 66 };

  const fish = rnd => ({ s: FISH, v: SM.pickW(FISH_V, FISH_W, rnd) });
  function cell(r, rnd, fs) {
    const x = rnd();
    if (x < CFG.scatterP && !fs) return { s: SCATTER };
    if (fs) {
      if (x < CFG.fishPFS) return fish(rnd);
      if (x < CFG.fishPFS + CFG.wildPFS) return { s: WILD };
      if (x < CFG.fishPFS + CFG.wildPFS + CFG.scatterP * 0.6) return { s: SCATTER };
    }
    // ve free spinech padají ryby jen přes fishPFS (ne z běžných vah)
    const id = SM.pickW(SYMS.map(s => s.id), SYMS.map(s => fs && s.id === FISH ? 0 : s.w), rnd);
    return id === FISH ? fish(rnd) : { s: id };
  }
  const filler = rnd => cell(0, rnd, false);
  function spin(rnd, fs = false) {
    const g = Array.from({ length: REELS }, (_, r) => Array.from({ length: ROWS }, () => cell(r, rnd, fs)));
    const ev = SM.ways(g, SYMS, WILD, fs ? CFG.fsPayScale : CFG.payScale);
    let fishSum = 0; for (const col of g) for (const x of col) if (x.s === FISH) fishSum += x.v;
    return { g, wins: ev.wins, total: ev.total, sc: SM.count(g, SCATTER), fishermen: SM.count(g, WILD), fishSum };
  }
  // stav free spinů
  // natural = chyceno ve hře → v počítadle už je 1 rybář
  function fsState(n, natural = false) { return { left: n, collected: natural ? 1 : 0, level: 0, total: 0 }; }
  const RETRIGGER = { 2: 2, 3: 5, 4: 8, 5: 10 };
  const retrigger = sc => sc >= 2 ? RETRIGGER[Math.min(sc, 5)] : 0;
  // vyhodnotí sběr ve free spinu; vrací {collect, retrig}
  function fsCollect(st, r) {
    let collect = 0;
    if (r.fishermen && r.fishSum) collect = r.fishSum * r.fishermen * LEVELS[st.level] * CFG.collectScale;
    let retrig = 0;
    const before = Math.floor(st.collected / 4);
    st.collected += r.fishermen;
    const after = Math.min(3, Math.floor(st.collected / 4));
    if (after > before && st.level < 3) { retrig = (after - Math.min(before, 3)) * 5; st.level = after; }
    retrig += retrigger(r.sc);
    return { collect, retrig };
  }
  function freeSpins(n, rnd, natural = false) {
    const st = fsState(n, natural);
    while (st.left > 0) { st.left--; const r = spin(rnd, true); const c = fsCollect(st, r); st.total += r.total + c.collect; st.left += c.retrig; }
    return st.total;
  }
  return { REELS, ROWS, SYMS, WILD, FISH, SCATTER, FREE_SPINS, LEVELS, RETRIGGER, CFG, filler, spin, fsState, fsCollect, freeSpins };
})();
if (typeof module !== 'undefined') module.exports = Game;

.stat{background:#0007;border:1px solid var(--acc2);border-radius:12px;padding:4px 8px;text-align:center}
.stat small{display:block;font-size:10px;letter-spacing:1.5px;opacity:.75}
.stat b{font-size:19px}.stat.w b{color:var(--acc);text-shadow:0 0 8px var(--glow)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.betbox{display:flex;align-items:center;justify-content:space-between;gap:4px;background:#0007;border:1px solid var(--acc2);border-radius:999px;padding:3px}
.betbox button{width:32px;height:32px;border-radius:50%;border:0;font-size:20px;font-weight:700;cursor:pointer;color:var(--btntext);background:var(--btn);font-family:inherit;line-height:1}
.betbox button:disabled{opacity:.4}
.betbox .bv{text-align:center;font-weight:700;font-size:15px;line-height:1.05}.betbox .bv small{display:block;font-size:9px;letter-spacing:1px;opacity:.7;font-weight:400}
.spin{width:86px;height:86px;border-radius:50%;cursor:pointer;border:0;padding:0;font-family:var(--tfont);font-weight:900;font-size:15px;color:#fff;letter-spacing:1px;background:var(--spinbg);
 box-shadow:0 0 0 3px var(--acc),0 0 0 5px #0008,0 0 22px var(--glow),0 6px 12px #000a;text-shadow:0 1px 3px #000}
.spin:active{transform:scale(.95)}.spin:disabled{filter:grayscale(.5) brightness(.8)}
.spin .ic{display:block;font-size:26px;line-height:1;font-family:'Fredoka'}
.side{display:flex;gap:6px;justify-content:center}
.pill{border:1.5px solid var(--acc2);border-radius:12px;padding:8px 9px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;color:#fff;background:#0007}
.pill.on{background:var(--btn);color:var(--btntext)}
.buy{border:0;border-radius:12px;padding:9px;font-family:var(--tfont);font-weight:800;font-size:14px;cursor:pointer;color:#fff;letter-spacing:1px;background:var(--buybg);box-shadow:0 3px 0 #0008,0 0 14px var(--glow);text-shadow:0 1px 2px #000}
.buy:disabled{filter:grayscale(.7);opacity:.6}.buy small{font-family:'Fredoka';font-weight:600;opacity:.85}
.foot{text-align:center;font-size:10px;opacity:.6}
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:#000c;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.card{max-width:420px;width:100%;max-height:88vh;overflow:auto;border-radius:20px;padding:20px 18px;text-align:center;color:#fff;background:var(--cardbg);border:1px solid var(--acc2);box-shadow:0 0 40px var(--glow);animation:kcin .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes kcin{from{transform:scale(.6);opacity:0}}
.card h2{margin:0 0 6px;font-family:var(--tfont);font-size:26px;color:var(--acc);text-shadow:0 0 12px var(--glow)}
.card .big{font-family:var(--tfont);font-weight:900;font-size:44px;color:#fff6d0;text-shadow:0 0 16px var(--glow);margin:4px 0}
.card p{margin:6px 0;font-size:14px;line-height:1.45}
.card .go{margin-top:10px;border:0;border-radius:999px;padding:11px 26px;font-family:var(--tfont);font-weight:800;font-size:16px;cursor:pointer;color:var(--btntext);background:var(--btn);box-shadow:0 3px 0 #0008}
.card .ghost{background:#ffffff22;color:#fff;margin-left:6px}
.pt{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}.pt td,.pt th{padding:3px;border-bottom:1px solid #ffffff1a}.pt th{font-size:10px;color:var(--acc)}
.pt svg{width:34px;height:30px;vertical-align:middle}
.rules{text-align:left;font-size:13px;line-height:1.45;padding-left:18px}.rules li{margin:3px 0}
.confetti{position:fixed;top:-20px;z-index:60;pointer-events:none;font-size:20px;animation:kfall linear forwards}
@keyframes kfall{to{transform:translateY(110vh) rotate(540deg)}}
.fly{position:fixed;z-index:30;pointer-events:none;font-weight:700;font-size:16px;color:#fff;text-shadow:0 0 4px #000,0 0 10px var(--glow);transition:transform .6s cubic-bezier(.5,0,.3,1),opacity .6s}

function catchUI(st) {
  const inLvl = st.level >= 3 ? 4 : st.collected % 4;
  Kit.top().innerHTML = `<div class="catch"><small>RYBÁŘI</small><div class="slots">${[0, 1, 2, 3].map(i => `<i class="${i < inLvl ? 'on' : ''}">${i < inLvl ? '🎣' : ''}</i>`).join('')}</div>
    <small>NÁSOBEK</small><div class="lv">×${Game.LEVELS[st.level]}</div></div>`;
}
async function freeSpins(n, b, natural = false) {
  Kit.confetti(20, ['🐟', '🎣', '💧']);
  await Kit.modal(`<h2>Jdeme na ryby!</h2><div class="big">${n} FREE SPINŮ</div><p>Každý <b>rybář</b> vyloví hodnoty všech ryb na válcích.</p><p>Každý 4. rybář = <b>+5 spinů</b> a vyšší násobek ×2 → ×3 → ×4.</p>${natural ? '<p style="color:#ffe14a"><b>Chycený bonus:</b> v počítadle už máš 1 rybáře!</p>' : ''}`, 'NAHODIT', Kit.auto ? 2200 : 0);
  Kit.bonus = true; Kit.bonusBet = b;
  const st = Game.fsState(n, natural); catchUI(st);
  Kit.fsBar(true, st.left, 0);
  while (st.left > 0) {
    st.left--; Kit.fsBar(true, st.left, st.total); Kit.msg('');
    const r = Game.spin(Math.random, true);
    await Kit.spinTo(r.g, { anticSym: Game.SCATTER });
    const lvl = st.level;
    const c = Game.fsCollect(st, r);
    // sběr ryb
    if (c.collect > 0) {
      const fishPos = [], menPos = [];
      r.g.forEach((col, x) => col.forEach((cell, y) => { if (cell.s === Game.FISH) fishPos.push([x, y, cell]); if (cell.s === Game.WILD) menPos.push([x, y]); }));
      Kit.highlight([...fishPos.map(([x, y]) => [x, y]), ...menPos]);
      for (const [mx, my] of menPos) {
        for (const [fx, fy, cell] of fishPos) { Kit.fly(Kit.cell(fx, fy), Kit.cell(mx, my), Kit.fmt(cell.v * b)); Kit.sfx.ding(fx); await Kit.wait(180); }
        await Kit.wait(450);
      }
      const v = Math.round(c.collect * b);
      Kit.setWin(v); Kit.winpop(Kit.fmt(v), `ÚLOVEK${Game.LEVELS[lvl] > 1 ? ' ×' + Game.LEVELS[lvl] : ''}`); Kit.sfx.big(); await Kit.wait(1600);
      st.total += v - c.collect * b; // zaokrouhlení
    } else if (r.fishermen) { Kit.msg('Rybář nahodil, ale žádná ryba nezabrala…'); }
    const w = Kit.coins(r.total);
    if (r.wins.length) await Kit.showWays(r.wins, w, names);
    st.total += c.collect * b + w;
    Kit.fsBar(true, st.left, st.total);
    if (st.level > lvl) { Kit.winpop('+' + c.retrig + ' SPINŮ', 'NÁSOBEK ×' + Game.LEVELS[st.level]); Kit.sfx.jp(); await Kit.wait(1600); }
    else if (c.retrig) { document.querySelectorAll('.sym.s10').forEach(e => e.classList.add('win')); Kit.winpop('+' + c.retrig + ' SPINŮ', r.sc + '× LODIČKA'); Kit.sfx.jp(); await Kit.wait(1400); }
    st.left += c.retrig; catchUI(st); Kit.fsBar(true, st.left, st.total);
    await Kit.wait(300);
  }
  const tot = Math.round(st.total);
  Kit.top().innerHTML = '';
  Kit.confetti(tot >= b * 30 ? 50 : 18, ['🐟', '💰', '🎣']);
  await Kit.modal(`<h2>Skvělý úlovek</h2><div class="big">${Kit.fmt(tot)}</div><p>${(Math.round(tot / b * 10) / 10).toLocaleString('cs-CZ')}× sázka</p>`, 'POKRAČOVAT', Kit.auto ? 2800 : 0);
  Kit.bonus = false; Kit.fsBar(false, 0, 0);
  return tot;
}
