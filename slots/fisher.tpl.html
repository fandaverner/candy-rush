:root{--bg0:#063a5a;--acc:#ffe14a;--acc2:#7fe0ff99;--glow:#3ad0ff66;--winglow:#fff6a066;--tfont:'Lilita One',sans-serif;
 --tgrad:linear-gradient(180deg,#fffbd0,#ffe14a 50%,#ff9a1a);
 --bgimg:radial-gradient(circle at 85% 8%,#fff7c0 0,#ffe14a 5%,transparent 14%),linear-gradient(180deg,#7fd8ff 0%,#3ab0e8 22%,#1a7ab8 38%,#0a5a8a 55%,#063a5a 80%,#042a40 100%);
 --frame:linear-gradient(180deg,#c88a4a,#8a5424 50%,#5a3412);--boardbg:#0a3a5a;--reelbg:linear-gradient(180deg,#5ac8f0,#1a7ab8 60%,#0a5a8a);
 --fsbar:linear-gradient(90deg,#0a7ab8,#2fc06a);--btn:linear-gradient(180deg,#fff08a,#ffb01a);--btntext:#3a2400;
 --spinbg:radial-gradient(circle at 50% 30%,#fff8 0 8%,transparent 30%),linear-gradient(180deg,#ff6a3a,#c42a1a);
 --buybg:linear-gradient(90deg,#0a7ab8,#ff8a1a);--cardbg:linear-gradient(180deg,#1a7ab8,#063a5a)}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:40vh;pointer-events:none;z-index:0;opacity:.5;
 background:radial-gradient(circle,#ffffff66 0 3px,transparent 4px),radial-gradient(circle,#ffffff44 0 2px,transparent 3px);background-size:70px 90px,110px 130px;animation:bub 7s linear infinite}
@keyframes bub{to{background-position:0 -180px,30px -260px}}
.frame{box-shadow:0 0 0 3px #3a1a06,0 10px 24px #000a!important}
.sym.s9 .val{background:linear-gradient(180deg,#fff08a,#ffb01a);color:#3a2400;text-shadow:none;border:1.5px solid #6a3a00;font-family:'Lilita One';font-size:calc(var(--cw)*.21);bottom:4%}
.sym.s9 .val.big{background:linear-gradient(180deg,#ff8aa8,#c4123a);color:#fff}
.catch{display:flex;align-items:center;gap:8px;justify-content:center;padding:5px 8px;border-radius:12px;background:#0007;border:1px solid #7fe0ff99}
.catch .slots{display:flex;gap:4px}
.catch .slots i{width:22px;height:22px;border-radius:50%;background:#ffffff22;border:1.5px solid #7fe0ff88;display:grid;place-items:center;font-style:normal;font-size:13px}
.catch .slots i.on{background:linear-gradient(180deg,#fff08a,#ffb01a);border-color:#fff}
.catch .lv{font-family:'Lilita One';font-size:18px;color:var(--acc);min-width:42px;text-align:center}
.catch small{font-size:10px;opacity:.8;letter-spacing:1px}
</style>

<script>
/*SLOTMATH*/
/*ENGINE*/
/*KIT*/

const names = ['J', 'Q', 'K', 'A', 'Splávek', 'Vážka', 'Prut', 'Krabička', 'Rybář', 'Ryba'];
Kit.create({
  key: 'fisher', prefix: 'f', reels: Game.REELS, rows: Game.ROWS, cellRatio: .9,
  title: 'ZLATÝ ÚLOVEK', subtitle: '243 CEST • RYBÁŘ SBÍRÁ RYBY',
  hint: 'Ve free spinech rybář vyloví hodnoty všech ryb na válcích!',
  filler: Game.filler, pulse: [Game.SCATTER], buyX: Game.CFG.buyX, buyLabel: '🎣 KOUPIT FREE SPINY', buyText: '10 free spinů s rybářem.',
  label: (c, b) => c.s === Game.FISH ? { t: Kit.fmt(c.v * b), cls: c.v >= 50 ? 'big' : '' } : null,
  info: () => {
    let rows = ''; for (const s of Game.SYMS.slice().reverse()) rows += `<tr><td><svg viewBox="0 0 100 100"><use href="#f${s.id}"/></svg></td>${s.pay.map(p => `<td>${(Math.round(p * Game.CFG.payScale * 100) / 100).toLocaleString('cs-CZ')}×</td>`).join('')}</tr>`;
    return `<h2>Pravidla</h2><ul class="rules">
      <li><b>5 válců × 3 řady = 243 cest.</b> Vyhrává 3–5 stejných symbolů na sousedních válcích zleva.</li>
      <li><svg viewBox="0 0 100 100" style="width:22px;vertical-align:middle"><use href="#f10"/></svg> <b>Lodička:</b> 3 = 10 free spinů, 4 = 15, 5 = 20.</li>
      <li><svg viewBox="0 0 100 100" style="width:22px;vertical-align:middle"><use href="#f8"/></svg> <b>Rybář</b> padá jen ve free spinech. Je WILD a <b>vyloví hodnoty všech ryb</b> na válcích (každý rybář zvlášť).</li>
      <li><b>Každý 4. rybář</b> přidá +10 free spinů a zvýší násobek úlovku: ×2 → ×3 → ×10. 3 lodičky ve free spinech = +5 spinů.</li>
      <li>Ryby mají hodnotu 2× až 1000× sázka. Koupě bonusu za ${Game.CFG.buyX}× sázka. Návratnost ≈ 96 %.</li></ul>
      <table class="pt"><tr><th></th><th>3×</th><th>4×</th><th>5×</th></tr>${rows}</table><p style="font-size:11px;opacity:.7">Výplaty v násobcích sázky za cestu.</p>`;
  },
  round: async b => {
    const r = Game.spin(Math.random);
    await Kit.spinTo(r.g, { anticSym: Game.SCATTER });
    let total = Kit.coins(r.total);
    await Kit.showWays(r.wins, total, names);
    if (r.sc >= 3) {
      document.querySelectorAll('.sym.s10').forEach(e => e.classList.add('win'));
      const n = Game.FREE_SPINS[Math.min(r.sc, 5)];
      Kit.winpop(n + ' FREE SPINŮ', r.sc + '× LODIČKA'); Kit.sfx.jp(); await Kit.wait(1700);
      total += await freeSpins(n, b);
    }
    return total;
  },
  buy: b => freeSpins(10, b),
});

function catchUI(st) {
  const inLvl = st.level >= 3 ? 4 : st.collected % 4;
  Kit.top().innerHTML = `<div class="catch"><small>RYBÁŘI</small><div class="slots">${[0, 1, 2, 3].map(i => `<i class="${i < inLvl ? 'on' : ''}">${i < inLvl ? '🎣' : ''}</i>`).join('')}</div>
    <small>NÁSOBEK</small><div class="lv">×${Game.LEVELS[st.level]}</div></div>`;
}
async function freeSpins(n, b) {
  Kit.confetti(20, ['🐟', '🎣', '💧']);
  await Kit.modal(`<h2>Jdeme na ryby!</h2><div class="big">${n} FREE SPINŮ</div><p>Každý <b>rybář</b> vyloví hodnoty všech ryb na válcích.</p><p>Každý 4. rybář = <b>+10 spinů</b> a vyšší násobek ×2 → ×3 → ×10.</p>`, 'NAHODIT', Kit.auto ? 2200 : 0);
  Kit.bonus = true; Kit.bonusBet = b;
  const st = Game.fsState(n); catchUI(st);
  Kit.fsBar(true, st.left, 0);
  while (st.left > 0) {
    st.left--; Kit.fsBar(true, st.left, st.total); Kit.msg('');
    const r = Game.spin(Math.random, true);
    await Kit.spinTo(r.g, { anticSym: Game.SCATTER });
    const lvl = st.level;
    const c = Game.fsCollect(st, r);
    // sběr ryb
    if (c.collect > 0) {
      const fishPos = [], menPos = [];
      r.g.forEach((col, x) => col.forEach((cell, y) => { if (cell.s === Game.FISH) fishPos.push([x, y, cell]); if (cell.s === Game.WILD) menPos.push([x, y]); }));
      Kit.highlight([...fishPos.map(([x, y]) => [x, y]), ...menPos]);
      for (const [mx, my] of menPos) {
        for (const [fx, fy, cell] of fishPos) { Kit.fly(Kit.cell(fx, fy), Kit.cell(mx, my), Kit.fmt(cell.v * b)); Kit.sfx.ding(fx); await Kit.wait(180); }
        await Kit.wait(450);
      }
      const v = Math.round(c.collect * b);
      Kit.setWin(v); Kit.winpop(Kit.fmt(v), `ÚLOVEK${Game.LEVELS[lvl] > 1 ? ' ×' + Game.LEVELS[lvl] : ''}`); Kit.sfx.big(); await Kit.wait(1600);
      st.total += v - c.collect * b; // zaokrouhlení
    } else if (r.fishermen) { Kit.msg('Rybář nahodil, ale žádná ryba nezabrala…'); }
    const w = Kit.coins(r.total);
    if (r.wins.length) await Kit.showWays(r.wins, w, names);
    st.total += c.collect * b + w;
    Kit.fsBar(true, st.left, st.total);
    if (st.level > lvl) { Kit.winpop('+10 SPINŮ', 'NÁSOBEK ×' + Game.LEVELS[st.level]); Kit.sfx.jp(); await Kit.wait(1600); }
    else if (c.retrig) { Kit.winpop('+' + c.retrig + ' SPINŮ', 'LODIČKY'); Kit.sfx.jp(); await Kit.wait(1400); }
    st.left += c.retrig; catchUI(st); Kit.fsBar(true, st.left, st.total);
    await Kit.wait(300);
  }
  const tot = Math.round(st.total);
  Kit.top().innerHTML = '';
  Kit.confetti(tot >= b * 30 ? 50 : 18, ['🐟', '💰', '🎣']);
  await Kit.modal(`<h2>Skvělý úlovek</h2><div class="big">${Kit.fmt(tot)}</div><p>${(Math.round(tot / b * 10) / 10).toLocaleString('cs-CZ')}× sázka</p>`, 'POKRAČOVAT', Kit.auto ? 2800 : 0);
  Kit.bonus = false; Kit.fsBar(false, 0, 0);
  return tot;
}
</script>
