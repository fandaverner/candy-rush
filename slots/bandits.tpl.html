body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:22vh;pointer-events:none;z-index:0;

.reel{border:1px solid #b88a4a}
.sym svg{filter:drop-shadow(0 2px 1px #0006)}

.stk{animation:stk .5s cubic-bezier(.2,1.6,.4,1)}
.stk .sym{height:var(--ch);width:100%}
.stk::before{content:"";position:absolute;inset:3px;border-radius:10px;box-shadow:inset 0 0 0 3px #ffc44a,0 0 14px #ff8a2a;background:#ffc44a22}
.stk .lock{position:absolute;right:4px;top:3px;font-size:12px}
@keyframes stk{from{transform:scale(1.6);opacity:0}}
.wanted{display:flex;align-items:center;gap:8px;justify-content:center;padding:4px 10px;border-radius:10px;background:#f4dcae;color:#3a1a00;border:2px solid #6a3a10;font-family:Rye;font-size:13px;box-shadow:0 3px 8px #0008}

<script>
/*SLOTMATH*/
/*ENGINE*/
/*KIT*/

const names = ['J', 'Q', 'K', 'A', 'Podkova', 'Klobouk', 'Revolver', 'Měšec'];
Kit.create({
  key: 'bandits', prefix: 'b', reels: Game.REELS, rows: Game.ROWS, cellRatio: .78,
  title: 'DIVOKÝ ZÁPAD', subtitle: '1 024 CEST • LEPIVÍ BANDITÉ',
  hint: 'Bandita je WILD s násobkem – v jedné cestě se násobky násobí!',
  filler: Game.filler, pulse: [Game.SCATTER], buyX: Game.CFG.buyX, buyLabel: '🤠 KOUPIT FREE SPINY', buyText: '10 free spinů s lepivými bandity.',
  label: c => c.s === Game.WILD ? { t: '×' + c.m } : null,
  info: () => {
    let rows = ''; for (let i = Game.SYMS.length - 1; i >= 0; i--) rows += `<tr><td><svg viewBox="0 0 100 100"><use href="#b${i}"/></svg></td>${Game.SYMS[i].pay.map(p => `<td>${(Math.round(p * Game.CFG.payScale * 1000) / 1000).toLocaleString('cs-CZ')}×</td>`).join('')}</tr>`;
    return `<h2>Pravidla</h2><ul class="rules">
      <li><b>5 válců × 4 řady = 1 024 cest.</b> Vyhrává 3–5 stejných symbolů na sousedních válcích zleva.</li>
      <li><svg viewBox="0 0 100 100" style="width:22px;vertical-align:middle"><use href="#b8"/></svg> <b>Bandita</b> (WILD, válce 2–4) má násobek ×2, ×3 nebo ×5. Prochází-li cesta více bandity, <b>násobky se navzájem násobí</b> (×3 a ×5 = ×15).</li>
      <li><svg viewBox="0 0 100 100" style="width:22px;vertical-align:middle"><use href="#b9"/></svg> <b>Šerifská hvězda:</b> 3 = 10 free spinů, 4 = 12, 5 = 15. Ve free spinech je každý bandita <b>lepivý</b> – zůstane na místě až do konce bonusu. 3+ hvězdy = +${Game.RETRIGGER} spinů.</li>
      <li>Maximální výhra bonusu ${Kit.fmt(Game.MAX_WIN)}× sázka. Koupě bonusu za ${Game.CFG.buyX}× sázka. Návratnost ≈ 96 %.</li></ul>
      <table class="pt"><tr><th></th><th>3×</th><th>4×</th><th>5×</th></tr>${rows}</table><p style="font-size:11px;opacity:.7">Výplaty v násobcích sázky za cestu (ve free spinech jiné tabulky).</p>`;
  },
  round: async b => {
    const r = Game.spin(Math.random);
    await Kit.spinTo(r.g, { anticSym: Game.SCATTER });
    let total = Kit.coins(r.total);
    await Kit.showWays(r.wins, total, names);
    if (r.sc >= 3) {
      document.querySelectorAll('.sym.s9').forEach(e => e.classList.add('win'));
      Kit.winpop(Game.FREE_SPINS[Math.min(r.sc, 5)] + ' FREE SPINŮ', r.sc + '× ŠERIF'); Kit.sfx.jp(); await Kit.wait(1700);
      total += await freeSpins(Game.FREE_SPINS[Math.min(r.sc, 5)], b);
    }
    return total;
  },
  buy: b => freeSpins(10, b),
});

async function freeSpins(n, b) {
  Kit.confetti(20, ['🤠', '⭐', '💰']);
  await Kit.modal(`<h2>Hledá se!</h2><div class="big">${n} FREE SPINŮ</div><p>Každý bandita, který padne, je <b>lepivý</b> a zůstane na místě až do konce bonusu – se svým násobkem.</p>`, 'JEDEME', Kit.auto ? 2200 : 0);
  Kit.bonus = true; Kit.bonusBet = b;
  const st = Game.emptySticky(); let left = n, tot = 0, sticky = 0;
  Kit.top().innerHTML = '<div class="wanted">🤠 LEPIVÍ BANDITÉ: <b id="nb">0</b></div>';
  Kit.fsBar(true, left, 0);
  while (left > 0) {
    left--; Kit.fsBar(true, left, tot); Kit.msg('');
    const r = Game.spin(Math.random, true, st);
    await Kit.spinTo(r.g, { anticSym: Game.SCATTER });
    const news = Game.addSticky(st, r.g);
    for (const [rr, y] of news) {
      const c = st[rr][y];
      Kit.overlay(rr, y, Kit.symHTML(c) + '<span class="lock">🔒</span>', 'stk'); Kit.tone(220, .2, 'square', .06); Kit.tone(660, .2, 'sine', .06, .08);
      sticky++; document.getElementById('nb').textContent = sticky;
      await Kit.wait(350);
    }
    let w = Kit.coins(r.total);
    if (tot + w > Game.MAX_WIN * b) w = Game.MAX_WIN * b - tot;
    if (r.wins.length) { Kit.clearOverlays('stk'); await Kit.showWays(r.wins, w, names); restoreSticky(st); }
    tot += w; Kit.fsBar(true, left, tot);
    if (r.sc >= 3) { left += Game.RETRIGGER; Kit.winpop('+' + Game.RETRIGGER + ' SPINŮ', 'ŠERIF'); Kit.sfx.jp(); await Kit.wait(1400); }
    if (tot >= Game.MAX_WIN * b) { Kit.winpop('MAX VÝHRA'); await Kit.wait(1500); break; }
    await Kit.wait(300);
  }
  Kit.clearOverlays('stk'); Kit.top().innerHTML = '';
  Kit.confetti(tot >= b * 30 ? 50 : 18, ['🤠', '💰', '⭐']);
  await Kit.modal(`<h2>Odměna vyplacena</h2><div class="big">${Kit.fmt(tot)}</div><p>${(Math.round(tot / b * 10) / 10).toLocaleString('cs-CZ')}× sázka • ${sticky} banditů chyceno</p>`, 'POKRAČOVAT', Kit.auto ? 2800 : 0);
  Kit.bonus = false; Kit.fsBar(false, 0, 0);
  return tot;
}
function restoreSticky(st) { st.forEach((col, r) => col.forEach((c, y) => { if (c) Kit.overlay(r, y, Kit.symHTML(c) + '<span class="lock">🔒</span>', 'stk'); })); document.querySelectorAll('.stk').forEach(e => e.style.animation = 'none'); }
</script>
