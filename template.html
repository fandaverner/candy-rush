<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Candy Rush 8×8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff5fa8;--deep:#5a1a6e;--cell:50px;--gold:#ffd54a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:#fff;overflow-x:hidden;
 background:
  radial-gradient(circle at 12% 18%,#fff6 0 3px,transparent 4px),
  radial-gradient(circle at 78% 8%,#ffe06688 0 3px,transparent 4px),
  radial-gradient(circle at 40% 70%,#7ff3ff77 0 3px,transparent 4px),
  radial-gradient(circle at 88% 60%,#ff9de277 0 3px,transparent 4px),
  radial-gradient(circle at 25% 92%,#b2ff8a77 0 3px,transparent 4px),
  linear-gradient(160deg,#ff8ccf 0%,#c25bd6 45%,#6a2ea8 100%);
 background-size:140px 140px,170px 170px,120px 120px,190px 190px,150px 150px,100% 100%;
 background-attachment:fixed}
.app{max-width:560px;margin:0 auto;padding:10px 10px 18px;display:flex;flex-direction:column;gap:10px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:24px;line-height:1;font-weight:700;letter-spacing:.5px;
 background:linear-gradient(180deg,#fff 0%,#ffe1f2 45%,#ff7cc0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 2px 0 #8a1f6b) drop-shadow(0 3px 6px #0005)}
h1 small{display:block;font-size:12px;letter-spacing:3px;color:#ffe9a6;-webkit-text-fill-color:#ffe9a6;filter:none;margin-top:3px}
.hbtns{display:flex;gap:6px}
.icon{width:38px;height:38px;border-radius:50%;border:2px solid #fff8;background:#ffffff26;color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer;font-family:inherit}
.bonusbar{display:none;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:16px;
 background:linear-gradient(90deg,#ff3d8b,#ff9d2e);box-shadow:0 4px 0 #a3185a,0 8px 16px #0004;font-weight:600}
.bonusbar.on{display:flex}
.bonusbar b{font-size:22px}
.meter{display:flex;align-items:center;gap:6px}
.meter .orb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;
 background:radial-gradient(circle at 35% 30%,#fff 0 8%,transparent 30%),conic-gradient(#ff4b6e,#ffb02e,#ffe94a,#5cff8a,#4bc9ff,#9a6bff,#ff4bd2,#ff4b6e);
 text-shadow:0 1px 2px #000a;box-shadow:0 0 12px #fff8}
.meter.bump .orb{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.45)}}
.frame{position:relative;padding:9px;border-radius:22px;
 background:repeating-linear-gradient(45deg,#fff 0 12px,#ff3d7f 12px 24px);box-shadow:0 8px 0 #9c1c58,0 14px 28px #0006}
.board{position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
 background:linear-gradient(180deg,#fff2fa,#ffd6ef);box-shadow:inset 0 0 0 2px #fff,inset 0 4px 14px #c0418555}
.board::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#e7a1cc33 1px,transparent 1px),linear-gradient(90deg,#e7a1cc33 1px,transparent 1px);background-size:12.5% 12.5%}
.cell{position:absolute;width:12.5%;height:12.5%;will-change:transform}
.tile{position:absolute;inset:5%;border-radius:26%;display:flex;align-items:center;justify-content:center;
 font-size:calc(var(--cell)*.58);line-height:1;box-shadow:inset 0 -4px 0 #0002,inset 0 3px 0 #fff8,0 2px 3px #0003;
 transition:transform .2s,filter .2s}
.cell:not(.s8) .tile{background:none!important;box-shadow:none!important;font-size:calc(var(--cell)*.8);filter:drop-shadow(0 3px 2px #8a1f6b55)}
.s0 .tile{background:linear-gradient(160deg,#9fe7ff,#3c9dff)}
.s1 .tile{background:linear-gradient(160deg,#ffe6b3,#e8a259)}
.s2 .tile{background:linear-gradient(160deg,#d9a8ff,#8a3fe0)}
.s3 .tile{background:linear-gradient(160deg,#ffb3c4,#ff3d6a)}
.s4 .tile{background:linear-gradient(160deg,#ffc4ec,#ff6fc7)}
.s5 .tile{background:linear-gradient(160deg,#b8ffe6,#29c79a)}
.s6 .tile{background:linear-gradient(160deg,#ffe98a,#d68a14);box-shadow:inset 0 -4px 0 #0002,inset 0 3px 0 #fff8,0 0 0 2px #fff6,0 2px 3px #0003}
.s7 .tile span{display:block;animation:lolly 2.4s ease-in-out infinite;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px #ff4bd2)}
@keyframes lolly{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.1)}}
.s8 .tile{border-radius:50%;inset:3%;background:radial-gradient(circle at 35% 30%,#fff 0 7%,transparent 32%),conic-gradient(#ff4b6e,#ffb02e,#ffe94a,#5cff8a,#4bc9ff,#9a6bff,#ff4bd2,#ff4b6e);
 font-size:calc(var(--cell)*.34);font-weight:700;text-shadow:0 2px 0 #7a1c5a,0 0 6px #000a;animation:wobble 1.6s ease-in-out infinite}
.s8.big .tile{box-shadow:0 0 14px 4px #fff,0 0 24px 6px #ffd54a}
@keyframes wobble{50%{transform:scale(1.07) rotate(4deg)}}
.cell.win .tile{animation:winPulse .55s ease-in-out;filter:brightness(1.2) drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px #ffd54a)!important}
@keyframes drop{0%{transform:translateY(var(--from));animation-timing-function:cubic-bezier(.5,0,.85,.4)}80%{transform:translateY(0);animation-timing-function:ease-out}90%{transform:translateY(-7%)}100%{transform:translateY(0)}}
@keyframes winPulse{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-6deg)}70%{transform:scale(1.12) rotate(5deg)}100%{transform:scale(1.15)}}
.cell.pop .tile{animation:pop .3s forwards}
@keyframes pop{to{transform:scale(0) rotate(90deg);opacity:0}}
.cell.glow .tile{animation:glow .7s ease-in-out 2;filter:brightness(1.3)}
@keyframes glow{50%{transform:scale(1.3)}}
.label{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-weight:700;font-size:calc(var(--cell)*.42);white-space:nowrap;z-index:5;
 color:#fff;text-shadow:0 2px 0 #b0145d,0 0 4px #b0145d,0 0 10px #000a;animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;text-align:center;
 font-weight:700;font-size:calc(var(--cell)*.8);color:#fff;text-shadow:0 3px 0 #b0145d,0 0 14px #000a;animation:bannerIn 1.4s ease-out forwards;white-space:nowrap}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}40%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.combo{position:absolute;top:-13px;left:50%;transform:translateX(-50%);z-index:9;padding:4px 14px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap;
 background:linear-gradient(90deg,#ffe94a,#ffb02e);color:#8a2a00;box-shadow:0 3px 0 #b06d00,0 4px 10px #0004;opacity:0;transition:opacity .25s}
.combo.on{opacity:1}
.combo.bump{animation:comboBump .45s}
@keyframes comboBump{40%{transform:translateX(-50%) scale(1.3)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#ffffff22;border:2px solid #ffffff55;border-radius:14px;padding:6px 10px;text-align:center;backdrop-filter:blur(4px)}
.stat .k{font-size:11px;letter-spacing:1.5px;opacity:.85;text-transform:uppercase}
.stat .v{font-size:20px;font-weight:700}
.stat.winv .v{color:var(--gold);text-shadow:0 2px 0 #8a4b00}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.betbox{display:flex;align-items:center;justify-content:center;gap:6px;background:#ffffff22;border:2px solid #ffffff55;border-radius:999px;padding:4px}
.betbox button{width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:#c2287a;font-size:22px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1}
.betbox .bv{min-width:64px;text-align:center;font-weight:700;font-size:16px}
.betbox .bv small{display:block;font-size:9px;letter-spacing:1px;opacity:.8;font-weight:400}
.spin{width:92px;height:92px;border-radius:50%;border:5px solid #fff;cursor:pointer;font-family:inherit;font-weight:700;font-size:20px;color:#fff;
 background:radial-gradient(circle at 35% 30%,#fff9 0 10%,transparent 35%),linear-gradient(160deg,#ff6fb0,#e8197a);
 box-shadow:0 6px 0 #9c1c58,0 10px 20px #0005;text-shadow:0 2px 0 #9c1c58;transition:transform .1s}
.spin:active{transform:translateY(4px);box-shadow:0 2px 0 #9c1c58,0 4px 10px #0005}
.spin:disabled{filter:grayscale(.5) brightness(.85)}
.spin .ic{font-size:30px;display:block;line-height:1}
.side{display:flex;gap:8px;justify-content:center}
.pill{border:2px solid #fff;border-radius:14px;padding:8px 10px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:#fff;background:#ffffff26}
.pill.on{background:#fff;color:#c2287a}
.buy{width:100%;border:0;border-radius:16px;padding:10px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;color:#5a2a00;
 background:linear-gradient(180deg,#ffef9a,#ffb627);box-shadow:0 4px 0 #b06d00,0 8px 14px #0004}
.buy:disabled{filter:grayscale(.6);opacity:.7}
.buy small{font-weight:600;opacity:.8}
.overlay{position:fixed;inset:0;background:#3a0a4acc;display:none;align-items:center;justify-content:center;z-index:50;padding:18px;backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.card{background:linear-gradient(170deg,#fff,#ffe3f3);color:#5a1a6e;border-radius:24px;padding:22px 20px;max-width:440px;width:100%;text-align:center;
 box-shadow:0 0 0 6px #ff7cc0,0 16px 40px #0008;max-height:88vh;overflow:auto;animation:cardIn .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes cardIn{from{transform:scale(.5);opacity:0}}
.card h2{margin:0 0 6px;font-size:30px;color:#e8197a}
.card .big{font-size:48px;font-weight:700;color:#e8197a;margin:6px 0}
.card p{margin:6px 0;font-size:15px}
.card .go{margin-top:12px;border:0;border-radius:999px;padding:12px 28px;font-family:inherit;font-weight:700;font-size:18px;color:#fff;cursor:pointer;
 background:linear-gradient(160deg,#ff6fb0,#e8197a);box-shadow:0 4px 0 #9c1c58}
.card .ghost{background:#eee;color:#5a1a6e;box-shadow:0 4px 0 #bbb;margin-left:8px}
.pt{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.pt th,.pt td{padding:4px 3px;border-bottom:1px solid #f3c6e0}
.pt th{font-size:11px;color:#a04580}
.pt td:first-child{font-size:22px}
.rules{text-align:left;font-size:14px;line-height:1.45}
.rules li{margin:4px 0}
.bigwin .card{background:radial-gradient(circle,#fff6c4,#ffcf3a);box-shadow:0 0 0 6px #fff,0 0 60px #ffd54a}
.bigwin h2{font-size:38px;color:#c2287a;text-shadow:0 2px 0 #fff}
.confetti{position:fixed;top:-20px;font-size:24px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.foot{text-align:center;font-size:11px;opacity:.75}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Candy Rush<small>8 × 8 • SHLUKY</small></h1>
    <div class="hbtns">
      <button class="icon" id="soundBtn" title="Zvuk">🔊</button>
      <button class="icon" id="infoBtn" title="Pravidla a výplaty">ℹ️</button>
    </div>
  </header>

  <div class="bonusbar" id="bonusBar">
    <div>FREE SPINY<br><b id="fsLeft">10</b></div>
    <div class="meter" id="meter"><span>NÁSOBEK</span><div class="orb" id="meterVal">×0</div></div>
    <div style="text-align:right">VÝHRA BONUSU<br><b id="fsWin">0</b></div>
  </div>

  <div class="frame"><div class="combo" id="combo">PROPOJENÍ ×2</div><div class="board" id="board"></div></div>

  <div class="stats">
    <div class="stat"><div class="k">Kredit</div><div class="v" id="bal">1 000</div></div>
    <div class="stat winv"><div class="k">Výhra</div><div class="v" id="win">0</div></div>
  </div>

  <div class="controls">
    <div class="betbox">
      <button id="betMinus">−</button>
      <div class="bv"><small>SÁZKA</small><span id="bet">10</span></div>
      <button id="betPlus">+</button>
    </div>
    <button class="spin" id="spinBtn"><span class="ic">⟳</span>TOČIT</button>
    <div class="side">
      <button class="pill" id="autoBtn">AUTO</button>
      <button class="pill" id="turboBtn">⚡</button>
    </div>
  </div>

  <button class="buy" id="buyBtn">🍭 KOUPIT BONUS <small id="buyCost">(1 000)</small></button>
  <div class="foot">Hra jen pro zábavu – fiktivní kredity, žádné skutečné peníze.</div>
</div>

<div class="overlay" id="ov"><div class="card" id="ovCard"></div></div>

<script>
/*ENGINE*/

// ---------- UI ----------
const $ = id => document.getElementById(id);
const board = $('board');
const BUY_X = 80;
const BETS = [10, 20, 30, 50, 100, 200, 500];
let st = { bal: 1000, betI: 0 };
try { const s = JSON.parse(localStorage.getItem('cukrova8c') || 'null'); if (s && typeof s.bal === 'number') { st = s; st.bal = Math.round(st.bal); st.betI = Math.min(Math.max(0, st.betI|0), BETS.length - 1); } } catch (e) {}
const save = () => { try { localStorage.setItem('cukrova8c', JSON.stringify(st)); } catch (e) {} };

let grid = null, busy = false, auto = false, turbo = false, sound = true;
let bonus = false, fsLeft = 0, meter = 0, fsTotal = 0, bonusBet = 1;
const bet = () => bonus ? bonusBet : BETS[st.betI];
const fmt = x => Math.round(x).toLocaleString('cs-CZ');
const fmtX = x => (Math.round(x * 10) / 10).toLocaleString('cs-CZ');
const wait = ms => new Promise(r => setTimeout(r, turbo ? ms * 0.45 : ms));

function sizeVars() { document.documentElement.style.setProperty('--cell', (board.clientWidth / 8) + 'px'); }
addEventListener('resize', sizeVars);

// ---------- Zvuk ----------
let actx = null, lastLand = 0;
function tone(f, d = 0.12, type = 'sine', v = 0.12, delay = 0) {
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.5, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const sfx = {
  land: () => { const n = performance.now(); if (n - lastLand < 45) return; lastLand = n; tone(260 + Math.random() * 120, .05, 'triangle', .035); },
  win: n => { for (let i = 0; i < 3; i++) tone(520 + n * 40 + i * 140, .14, 'sine', .1, i * .07); },
  pop: () => tone(900, .08, 'square', .03),
  multi: () => { [660, 880, 1320].forEach((f, i) => tone(f, .18, 'triangle', .1, i * .08)); },
  scatter: () => { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .25, 'sine', .12, i * .1)); },
};

// ---------- Vykreslení ----------
function render(g, spinMode = false) {
  let maxEnd = 0;
  board.querySelectorAll('.cell').forEach(e => e.remove());
  const els = [];
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
    const x = g[c][r], el = document.createElement('div');
    el.className = 'cell s' + x.s + (x.s === MULTI && x.m >= 25 ? ' big' : '');
    el.style.left = (c * 12.5) + '%'; el.style.top = (r * 12.5) + '%';
    el.dataset.c = c; el.dataset.r = r;
    const t = document.createElement('div'); t.className = 'tile';
    if (x.s === MULTI) t.textContent = '×' + x.m;
    else if (x.s === SCATTER) t.innerHTML = '<span>🍭</span>';
    else t.textContent = SYMS[x.s].e;
    el.appendChild(t);
    const from = x.from === undefined ? r : x.from;
    if (from !== r) {
      // každý symbol padá samostatně: spodní řady dřív, sloupce s malým posunem
      const k = turbo ? 0.45 : 1, dist = r - from;
      const delay = spinMode ? ((ROWS - 1 - r) * 95 + c * 32) * k : ((ROWS - 1 - r) * 55 + c * 40) * k;
      const dur = (320 + Math.sqrt(dist) * 175) * k;
      maxEnd = Math.max(maxEnd, delay + dur);
      el.style.setProperty('--from', `${(from - r) * 100}%`);
      el.style.animation = `drop ${dur}ms ${delay}ms both`;
      el.addEventListener('animationend', () => { sfx.land(); el.style.animation = ''; }, { once: true });
    }
    board.appendChild(el);
  }
  // vymazat 'from', aby se příště nepřehrávalo
  for (const col of g) for (const x of col) delete x.from;
  return maxEnd;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
// staré symboly postupně vypadnou dolů
async function dropOut() {
  const k = turbo ? 0.45 : 1;
  board.querySelectorAll('.cell').forEach(el => {
    const c = +el.dataset.c, r = +el.dataset.r;
    el.style.transition = `transform ${420 * k}ms cubic-bezier(.55,0,1,.45) ${((ROWS - 1 - r) * 60 + c * 22) * k}ms`;
    el.style.transform = `translateY(${(ROWS - r + 1) * 100}%)`;
  });
  await sleep(((ROWS - 1) * 60 + (COLS - 1) * 22 + 420) * k);
}
const cellEl = (c, r) => board.querySelector(`.cell[data-c="${c}"][data-r="${r}"]`);

function label(text, cx, cy, cls = 'label') {
  const l = document.createElement('div'); l.className = cls; l.textContent = text;
  l.style.left = (cx * 12.5 + 6.25) + '%'; l.style.top = (cy * 12.5 + 6.25) + '%';
  board.appendChild(l); setTimeout(() => l.remove(), 1600);
}
function banner(text) {
  const b = document.createElement('div'); b.className = 'banner'; b.textContent = text;
  board.appendChild(b); setTimeout(() => b.remove(), 1500);
}

function updateUI() {
  $('bal').textContent = fmt(st.bal);
  $('bet').textContent = fmt(bet());
  $('buyCost').textContent = '(' + fmt(BETS[st.betI] * BUY_X) + ')';
  $('bonusBar').classList.toggle('on', bonus);
  $('fsLeft').textContent = fsLeft;
  $('meterVal').textContent = '×' + meter;
  $('fsWin').textContent = fmt(fsTotal);
  $('spinBtn').disabled = busy && !auto;
  $('buyBtn').disabled = busy || bonus || st.bal < BETS[st.betI] * BUY_X;
  $('betMinus').disabled = $('betPlus').disabled = busy || bonus;
}
function showCombo(m) {
  const el = $('combo'); el.textContent = 'PROPOJENÍ ×' + m; el.classList.add('on');
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}
function hideCombo() { setTimeout(() => $('combo').classList.remove('on'), 600); }
function setWin(x) { $('win').textContent = fmt(x); }

// ---------- Jeden spin s animací ----------
async function spinRound() {
  const b = bet();
  let total = 0;
  await dropOut();
  grid = fillGrid(bonus, Math.random);
  for (const col of grid) col.forEach((x, r) => x.from = -1.5);
  await sleep(render(grid, true) + 80);
  setWin(0);
  let step = 0;
  for (;;) {
    const cl = findClusters(grid, bonus);
    if (!cl.length) break;
    let sw = 0;
    for (const k of cl) {
      step++;
      if (!bonus && step > 1) showCombo(cascadeMulti(step));
      const kw = Math.max(1, Math.round(k.win * b)); sw += kw;
      for (const [c, r] of k.cells) cellEl(c, r)?.classList.add('win');
      const cx = k.cells.reduce((a, p) => a + p[0], 0) / k.cells.length;
      const cy = k.cells.reduce((a, p) => a + p[1], 0) / k.cells.length;
      label('+' + fmt(kw), cx, cy);
    }
    sfx.win(step);
    total += sw; setWin(total);
    await wait(700);
    for (const k of cl) for (const [c, r] of k.cells) cellEl(c, r)?.classList.add('pop');
    sfx.pop();
    await wait(260);
    grid = tumble(grid, cl.flatMap(k => k.cells), bonus, Math.random);
    await sleep(render(grid) + 80);
  }

  // Násobky
  const ms = multis(grid);
  if (ms.length) {
    for (const m of ms) cellEl(m.c, m.r)?.classList.add('glow');
    sfx.multi();
    const sum = ms.reduce((a, m) => a + m.m, 0);
    if (bonus) {
      meter += sum; updateUI();
      $('meter').classList.remove('bump'); void $('meter').offsetWidth; $('meter').classList.add('bump');
      banner('+×' + sum + ' do násobku');
    }
    await wait(900);
  }
  const mult = bonus ? meter : (step > 1 ? cascadeMulti(step) : 0);
  if (total > 0 && mult > 0) {
    banner(fmt(total) + ' × ' + mult);
    total = Math.round(total * mult); sfx.multi();
    await wait(1100);
    setWin(total);
  }
  hideCombo();

  // Scattery
  const sc = countSym(grid, SCATTER);
  let trig = 0, start = 0;
  if (sc >= 3) {
    board.querySelectorAll('.cell.s7').forEach(e => e.classList.add('glow'));
    sfx.scatter();
    const sp = Math.round(SCATTER_PAY[Math.min(sc, 7)] * b);
    total += sp; setWin(total);
    banner(sc + '× 🍭  +' + fmt(sp));
    await wait(1500);
    trig = bonus ? retrigger(sc) : FREE_SPINS[Math.min(sc, 5)];
    if (!bonus) start = START_MULTI[Math.min(sc, 5)];
  } else if (bonus && sc === 2) {
    board.querySelectorAll('.cell.s7').forEach(e => e.classList.add('glow'));
    sfx.scatter();
    await wait(900);
    trig = retrigger(sc);
  }
  return { total, trig, start };
}

// ---------- Hlavní tlačítko ----------
async function spin() {
  if (busy) return;
  const b = BETS[st.betI];
  if (st.bal < b) { noMoney(); return; }
  busy = true;
  st.bal -= b; updateUI();
  const r = await spinRound();
  st.bal += r.total; save();
  if (r.total >= b * 20) await bigWin(r.total, b);
  updateUI();
  if (r.trig) await runBonus(r.trig, b, r.start);
  busy = false; updateUI();
  if (auto) { await wait(350); if (auto) spin(); }
}

async function runBonus(spins, b, start = 0) {
  bonusBet = b;
  await modal(`<h2>🍭 BONUS! 🍭</h2><div class="big">${spins} FREE SPINŮ</div>${start ? `<p style="font-size:20px">Startovní násobek <b style="color:#e8197a">×${start}</b>!</p>` : ''}
    <p>Násobky ve free spinech <b>zůstávají a sčítají se</b>.<br>Celkový násobek se uplatní na každou výhru!</p>
    <p style="font-size:13px;opacity:.8">Lízátka v bonusu: 2 = +2, 3 = +5, 4 = +8, 5 = +10 spinů</p>`, 'START', auto ? 2200 : 0);
  bonus = true; fsLeft = spins; meter = start; fsTotal = 0; updateUI();
  while (fsLeft > 0) {
    fsLeft--; updateUI();
    const r = await spinRound();
    fsTotal += r.total; st.bal += r.total; save();
    if (r.trig) { fsLeft += r.trig; banner('+' + r.trig + ' SPINŮ!'); await wait(1300); }
    updateUI();
    await wait(450);
  }
  const t = fsTotal;
  bonus = false; updateUI();
  confetti(t >= b * 20 ? 40 : 15);
  await modal(`<h2>KONEC BONUSU</h2><p>Celkem jsi vyhrál</p><div class="big">${fmt(t)}</div>
    <p>to je <b>${fmtX(t / b)}×</b> sázka • konečný násobek ×${meter}</p>`, 'POKRAČOVAT', auto ? 3000 : 0);
  meter = 0; fsTotal = 0; updateUI();
}

async function bigWin(x, b) {
  const r = x / b;
  const t = r >= 500 ? 'SUGAR MEGA WIN' : r >= 100 ? 'SUPER VÝHRA' : r >= 50 ? 'VELKÁ VÝHRA' : 'PĚKNÁ VÝHRA';
  confetti(r >= 100 ? 50 : 25);
  $('ov').classList.add('bigwin');
  await modal(`<h2>${t}!</h2><div class="big" id="bwN">0</div><p>${fmtX(r)}× sázka</p>`, 'SUPER', auto ? 2500 : 0, () => {
    const el = $('bwN'), t0 = performance.now(), dur = 1400;
    const f = now => { const k = Math.min(1, (now - t0) / dur); el.textContent = fmt(x * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
  $('ov').classList.remove('bigwin');
}

function confetti(n) {
  const e = ['🍬', '🍭', '🍫', '🧁', '🍩', '⭐', '✨', '🍓'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div'); s.className = 'confetti';
    s.textContent = e[i % e.length]; s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (1.8 + Math.random() * 2) + 's'; s.style.animationDelay = Math.random() * .8 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 5000);
  }
}

function modal(html, btn, autoClose = 0, after) {
  return new Promise(res => {
    $('ovCard').innerHTML = html + (btn ? `<div><button class="go" id="ovGo">${btn}</button></div>` : '');
    $('ov').classList.add('on');
    let done = false;
    const close = () => { if (done) return; done = true; $('ov').classList.remove('on'); res(); };
    if (btn) $('ovGo').onclick = close;
    if (autoClose) setTimeout(close, autoClose);
    if (after) after();
  });
}

function noMoney() {
  auto = false; $('autoBtn').classList.remove('on');
  modal(`<h2>Došel kredit 😢</h2><p>Na tuhle sázku nemáš dost kreditů.</p>
    <button class="go" id="refill">Doplnit 1 000</button><button class="go ghost" id="nope">Zavřít</button>`, null).then(() => {});
  $('refill').onclick = () => { st.bal += 1000; save(); updateUI(); $('ov').classList.remove('on'); };
  $('nope').onclick = () => $('ov').classList.remove('on');
}

function showInfo() {
  const b = BETS[st.betI];
  const cols = [[0, '5'], [3, '8'], [5, '10'], [6, '12'], [7, '15+']];
  let rows = '';
  for (let i = SYMS.length - 1; i >= 0; i--) {
    const s = SYMS[i];
    rows += `<tr><td>${s.e}</td>${cols.map(([k]) => `<td>${fmt(s.base[k] * b / 10)}</td>`).join('')}</tr>`;
  }
  $('ovCard').innerHTML = `<h2>Pravidla</h2>
  <ul class="rules">
   <li>Hrací plocha <b>8×8</b>. Výhra padá za <b>shluk 5 a více stejných symbolů</b>, které se dotýkají stranou – kdekoli na ploše, i uprostřed.</li>
   <li>Výherní symboly zmizí, ostatní <b>propadnou dolů</b> a shora spadnou nové – výhry se můžou řetězit.</li>
   <li>🔗 <b>Propojení v základní hře</b>: každý výherní shluk (i dva různé symboly naráz) je samostatné propojení. Výhry se během kola sčítají a <b>po konci kola</b> se celá výhra vynásobí podle počtu propojení: 2 = ×2, 3 = ×4, 4 = ×6, 5 = ×8, 6 = ×10 …</li>
   <li>🌈 <b>Násobky</b> (×2 až ×50) padají <b>jen ve free spinech</b>.</li>
   <li>🍭 <b>Scatter</b>: 3 = 10 free spinů, 4 = 12 spinů + startovní násobek ×${START_MULTI[4]}, 5+ = 15 spinů + startovní násobek ×${START_MULTI[5]} (+ výplata 3×/5×/10× sázka).</li>
   <li>Ve <b>free spinech</b> se každý násobek přičte do <b>celkového násobku</b>, který vydrží do konce bonusu a násobí každou výhru. Lízátka v bonusu přidají spiny: 2 = +2, 3 = +5, 4 = +8, 5+ = +10.</li>
   <li>Bonus (10 spinů) lze koupit za ${BUY_X}× sázka. Teoretická návratnost (RTP) ≈ 96 %.</li>
  </ul>
  <table class="pt"><tr><th></th>${cols.map(c => `<th>${c[1]}</th>`).join('')}</tr>${rows}</table>
  <p style="font-size:12px;opacity:.75">Základní výplaty pro sázku ${fmt(b)} (před násobkem propojení; ve free spinech jsou výplaty vyšší) • Fiktivní kredity, jen pro zábavu.</p>
  <button class="go" id="ovGo">ROZUMÍM</button>`;
  $('ov').classList.add('on');
  $('ovGo').onclick = () => $('ov').classList.remove('on');
}

// ---------- Ovládání ----------
$('spinBtn').onclick = () => { if (auto) { auto = false; $('autoBtn').classList.remove('on'); updateUI(); return; } spin(); };
$('autoBtn').onclick = () => {
  auto = !auto; $('autoBtn').classList.toggle('on', auto);
  if (auto && !busy) spin(); updateUI();
};
$('turboBtn').onclick = () => { turbo = !turbo; $('turboBtn').classList.toggle('on', turbo); };
$('soundBtn').onclick = () => { sound = !sound; $('soundBtn').textContent = sound ? '🔊' : '🔇'; };
$('infoBtn').onclick = showInfo;
$('betMinus').onclick = () => { if (st.betI > 0) st.betI--; save(); updateUI(); };
$('betPlus').onclick = () => { if (st.betI < BETS.length - 1) st.betI++; save(); updateUI(); };
$('buyBtn').onclick = async () => {
  const b = BETS[st.betI], cost = b * BUY_X;
  if (busy || bonus || st.bal < cost) return;
  let ok = false;
  await new Promise(res => {
    $('ovCard').innerHTML = `<h2>Koupit bonus?</h2><p>10 free spinů se sčítajícími násobky</p><div class="big">${fmt(cost)}</div>
      <button class="go" id="y">KOUPIT</button><button class="go ghost" id="n">Zpět</button>`;
    $('ov').classList.add('on');
    $('y').onclick = () => { ok = true; $('ov').classList.remove('on'); res(); };
    $('n').onclick = () => { $('ov').classList.remove('on'); res(); };
  });
  if (!ok) return;
  busy = true; st.bal -= cost; save(); updateUI();
  await runBonus(10, b);
  busy = false; updateUI();
};
document.addEventListener('keydown', e => { if (e.code === 'Space' && !$('ov').classList.contains('on')) { e.preventDefault(); $('spinBtn').click(); } });

// start
sizeVars();
grid = fillGrid(false, Math.random);
// úvodní plocha bez okamžitých výher
for (let i = 0; i < 50 && findClusters(grid).length; i++) grid = fillGrid(false, Math.random);
for (const col of grid) col.forEach((x, r) => x.from = -1.5);
render(grid, true); updateUI();
</script>
</body>
